name: CI

on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to its release. Leave empty to only build."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context! needs the built frontend in dist/ to compile
      - name: Build frontend
        run: pnpm build

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build (windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build

      - name: Package
        shell: bash
        run: |
          mkdir -p out
          cp target/release/hac.exe out/HAC_Autoclicker-windows.exe
          cp target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi out/

      - uses: actions/upload-artifact@v4
        with:
          name: HAC_Autoclicker-windows
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag' || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
