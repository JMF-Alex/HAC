[package]
name = "hac"
version = "1.0.0"
edition = "2024"

[dependencies]
fastrand = "2.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tauri = { version = "2.12.5", features = [] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14.0", features = ["xinput", "xtest"] }

[[test]]
name = "app_format"
path = "tests/app/format.rs"

[[test]]
name = "core_constants"
path = "tests/core/constants.rs"

[[test]]
name = "core_engine_clicker"
path = "tests/core/engine/clicker.rs"

[[test]]
name = "core_engine_failsafe"
path = "tests/core/engine/failsafe.rs"

[[test]]
name = "core_storage_config"
path = "tests/core/storage/config.rs"

[[test]]
name = "core_storage_profiles"
path = "tests/core/storage/profiles.rs"
